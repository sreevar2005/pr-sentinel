[project]
name = "pr-sentinel"
version = "0.1.0"
description = "Advisory pull request review: deterministic checks plus grounded, schema-validated AI findings. Never approves or merges."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5.0,<3",
    "google-genai>=2.34.0,<3",
    "httpx2>=2.16,<3",
    "pydantic>=2.14.3,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
pr-sentinel = "pr_sentinel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"src/pr_sentinel/checks.py" = ["S603"]  # subprocess with shell=False and argv list, by design

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pr_sentinel"]
mypy_path = "src"
